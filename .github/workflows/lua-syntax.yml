name: Lua syntax

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Parse plugin Lua files
        run: find jellyfin.koplugin -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
